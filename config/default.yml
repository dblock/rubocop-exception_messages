ExceptionMessages:
  Enabled: true

ExceptionMessages/Casing:
  Description: 'Checks the capitalization of raised exception messages.'
  Enabled: true
  EnforcedStyle: lowercase
  SupportedStyles:
    - lowercase
    - uppercase
  VersionAdded: '0.1'
  VersionChanged: '0.2'

ExceptionMessages/Punctuation:
  Description: 'Checks the trailing punctuation of raised exception messages.'
  Enabled: true
  EnforcedStyle: no_period
  SupportedStyles:
    - no_period
    - period
  VersionAdded: '0.1'
  VersionChanged: '0.2'

ExceptionMessages/RedundantExceptionName:
  Description: 'Checks that raised exception messages do not repeat the exception class name.'
  Enabled: true
  VersionAdded: '0.2'

ExceptionMessages/QuoteStyle:
  Description: 'Checks that interpolated values in raised exception messages are consistently quoted.'
  Enabled: true
  EnforcedStyle: backticks
  SupportedStyles:
    - backticks
    - single_quotes
    - double_quotes
    - square_brackets
    - parentheses
    - curly_braces
    - custom
    - none
  Prefix: ~
  Suffix: ~
  VersionAdded: '0.2'

ExceptionMessages/RequireMessage:
  Description: 'Checks that a raised exception is given a message.'
  Enabled: true
  AllowedExceptions:
    - NotImplementedError
  VersionAdded: '0.3'

ExceptionMessages/NoGenericMessage:
  Description: 'Checks that a raised exception message has an appropriate length and is not generic.'
  Enabled: true
  MaximumLength: ~
  MinimumWords: 1
  MaximumWords: ~
  GenericMessages:
    - bad
    - error
    - failed
    - invalid
  Exceptions: {}
  VersionAdded: '0.3'
